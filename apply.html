<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waitlist · Threshold Residency</title>
<meta name="description" content="Join the waitlist for Threshold's Expedition I.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
<link rel="preload" as="image" type="image/webp" href="/confirm-1.webp">
<link rel="preload" as="image" type="image/webp" href="/confirm-2.webp">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/cormorant-garamond-400.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/ibm-plex-mono-400.woff2">
<style>
/* ─── Nav ─── */
.home-nav {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 24px var(--gutter);
  width: 100%;
}

.apply-main {
  max-width: 520px;
  margin: 0 auto;
  padding: 0 2.5rem;
  height: calc(100vh - 72px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow: hidden;
}

.apply-label {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.68);
  margin-bottom: 4rem;
}

.apply-heading {
  font-family: var(--serif);
  font-weight: 300;
  font-size: clamp(22px, 3.5vw, 34px);
  line-height: 1.15;
  letter-spacing: -0.02em;
  color: var(--fg);
  margin-bottom: 3rem;
}

.field {
  margin-bottom: 2.5rem;
}

.field label {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.68);
  margin-bottom: 0.75rem;
}

.field input {
  display: block;
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid rgba(255,255,255,0.18);
  color: var(--fg);
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 300;
  line-height: 1.75;
  padding: 10px 0;
  outline: none;
  transition: border-color 0.3s;
  border-radius: 0;
  -webkit-appearance: none;
}

.field input:focus {
  border-bottom-color: rgba(255,255,255,0.45);
}

.field input::placeholder {
  color: rgba(255,255,255,0.35);
}

.btn:disabled {
  opacity: 0.2;
  cursor: default;
  pointer-events: none;
}

.apply-note {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.14em;
  color: rgba(255,255,255,0.42);
  margin-top: 2rem;
  line-height: 1.7;
}

.apply-note a {
  color: rgba(255,255,255,0.42);
  text-decoration: none;
  border-bottom: 1px solid rgba(255,255,255,0.18);
  transition: color 0.2s, border-color 0.2s;
}

.apply-note a:hover {
  color: var(--fg);
  border-bottom-color: rgba(255,255,255,0.55);
}

.apply-response {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 400;
  letter-spacing: 0.14em;
  color: rgba(255,255,255,0.42);
  margin-top: 2rem;
  min-height: 1.5em;
  line-height: 1.7;
  transition: opacity 0.3s;
}

.apply-response a {
  color: rgba(255,255,255,0.42);
  text-decoration: none;
  border-bottom: 1px solid rgba(255,255,255,0.18);
}

.apply-response a:hover {
  color: var(--fg);
}

/* ─── Confirmation ─── */
.apply-confirm {
  display: none;
}

.apply-confirm.visible {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  height: 100%;
}

.confirm-painting {
  max-width: 400px;
  width: 100%;
  height: auto;
  margin-bottom: 2.5rem;
}

.confirm-quote {
  font-family: var(--serif);
  font-weight: 300;
  font-style: italic;
  font-size: clamp(16px, 2vw, 20px);
  line-height: 1.5;
  color: rgba(255,255,255,0.5);
  margin-bottom: 0.6rem;
}

.confirm-attr {
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 300;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.25);
  margin-bottom: 3rem;
}

.confirm-link {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 400;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--fg-meta);
  text-decoration: none;
  border-bottom: 1px solid rgba(255,255,255,0.18);
  padding-bottom: 2px;
  transition: color 0.2s, border-color 0.2s;
}

.confirm-link:hover {
  color: var(--fg);
  border-bottom-color: rgba(255,255,255,0.55);
}

/* ─── Honeypot ─── */
.hp-field {
  position: absolute;
  left: -9999px;
  opacity: 0;
  height: 0;
  width: 0;
  overflow: hidden;
}

@media (max-width: 600px) {
  .apply-main {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

}

@media (min-width: 1024px) {
  .apply-main {
    max-width: 580px;
    padding: 6rem 40px 10rem;
  }
}
</style>
</head>
<body>

<nav class="home-nav">
  <div class="site-nav">
    <a href="/" class="nav-link">Threshold</a>
  </div>
</nav>

<main class="apply-main">
  <div class="hp-field" aria-hidden="true">
    <label for="hp_website">Website</label>
    <input type="text" id="hp_website" name="_hp" tabindex="-1" autocomplete="off">
  </div>

  <form id="waitlistForm" novalidate style="width:100%;">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
    </div>

    <button type="submit" class="btn btn-outline" id="submitBtn" disabled>Join</button>
    <p class="apply-response" id="response"></p>
  </form>

  <p class="apply-note" id="waitlistNote">We'll email you when applications open.</p>

  <div class="apply-confirm" id="confirmView">
    <picture>
      <source id="confirmSource" type="image/webp" srcset="">
      <img src="" alt="" class="confirm-painting" id="confirmImg" style="opacity:0;transition:opacity 400ms ease;">
    </picture>
    <p class="confirm-quote" id="confirmQuote"></p>
    <p class="confirm-attr" id="confirmAttr"></p>
    <a href="/" class="confirm-link">Return to Threshold</a>
  </div>
</main>


<script>
(function() {
  var form = document.getElementById('waitlistForm');
  var submitBtn = document.getElementById('submitBtn');
  var response = document.getElementById('response');
  var confirmView = document.getElementById('confirmView');
  var waitlistNote = document.getElementById('waitlistNote');
  var confirmImg = document.getElementById('confirmImg');
  var confirmSource = document.getElementById('confirmSource');

  var confirmations = [
    { webp: '/confirm-1.webp', jpg: '/confirm-1.jpg', alt: 'Shackleton expedition, Union Jack at the South Pole', width: 1200, height: 901, quote: '\u201CCome, my friends, \u2019tis not too late to seek a newer world.\u201D', attr: 'Tennyson, Ulysses (1842)' },
    { webp: '/confirm-2.webp', jpg: '/confirm-2.jpg', alt: 'Shackleton crew waving from Elephant Island', width: 1200, height: 1189, quote: '\u201CCome, my friends, \u2019tis not too late to seek a newer world.\u201D', attr: 'Tennyson, Ulysses (1842)' }
  ];

  // Pick immediately so the browser starts downloading in the background
  var pick = confirmations[Math.floor(Math.random() * confirmations.length)];
  confirmSource.srcset = pick.webp;
  confirmImg.src = pick.jpg;
  confirmImg.alt = pick.alt;
  confirmImg.width = pick.width;
  confirmImg.height = pick.height;

  // Start decoding now so it's ready before the user submits
  var imgReady = confirmImg.decode().then(function() {
    return true;
  }).catch(function() {
    return true;
  });

  function getVal(id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; }
  function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

  function showConfirm() {
    var q = document.getElementById('confirmQuote');
    var a = document.getElementById('confirmAttr');
    if (pick.quote) { q.textContent = pick.quote; } else { q.style.display = 'none'; }
    if (pick.attr) { a.textContent = pick.attr; } else { a.style.display = 'none'; }
    form.style.display = 'none';
    waitlistNote.style.display = 'none';
    document.querySelector('.home-nav').style.display = 'none';
    confirmView.classList.add('visible');
    // Image should already be decoded; fade in instantly
    imgReady.then(function() {
      confirmImg.style.opacity = '0.85';
    });
  }

  function validate() {
    submitBtn.disabled = !(getVal('email') && isValidEmail(getVal('email')));
  }

  document.addEventListener('input', validate);

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    if (submitBtn.disabled) return;

    submitBtn.disabled = true;
    submitBtn.textContent = '...';
    response.textContent = '';

    var payload = {
      _hp: document.getElementById('hp_website').value,
      email: getVal('email')
    };

    // Skip fetch on localhost — show confirmation directly
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      showConfirm();
      return;
    }

    fetch('/.netlify/functions/join-waitlist', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(function(r) {
      if (!r.ok) throw new Error();
      showConfirm();
    })
    .catch(function() {
      response.textContent = 'Try again.';
      submitBtn.textContent = 'Join';
      validate();
    });
  });

  validate();
})();
</script>

</body>
</html>
