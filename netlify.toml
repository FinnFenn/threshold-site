[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/expedition"
  to = "/expedition.html"
  status = 200

[[redirects]]
  from = "/archive"
  to = "/expedition"
  status = 301

[[redirects]]
  from = "/apply"
  to = "/apply.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/preview"
  to = "/preview.html"
  status = 200

[functions."thanks-catchup"]
  schedule = "@hourly"

[functions."launch-email"]
  schedule = "0 9 30 11 *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
